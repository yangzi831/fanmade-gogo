services:
  materials:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin in .env.production}
      TRUST_PROXY: "1"
    volumes:
      - materials-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  materials-data:
